
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f6f1">
  <title>Ruang Baca — Cerita Hari Ini</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f8f6f1;
      --paper: #fffefa;
      --ink: #292720;
      --muted: #777367;
      --accent: #6d7352;
      --line: #e9e5da;
      --soft: #f0eee6;
      --danger: #8b4a40;
      --read-blue: #52769a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.6;
    }

    button, input, textarea {
      font: inherit;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.48;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 15;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 15px max(24px, calc((100vw - 1120px) / 2));
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--bg) 94%, transparent);
      backdrop-filter: blur(12px);
    }

    .brand {
      flex: 0 0 auto;
      color: var(--ink);
      font-size: 1.22rem;
      text-decoration: none;
    }

    .site-nav {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      flex-wrap: wrap;
    }

    .nav-link, .nav-icon-button {
      padding: 8px 10px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font: 600 0.82rem system-ui, sans-serif;
      text-decoration: none;
      white-space: nowrap;
    }

    .nav-link:hover, .nav-icon-button:hover,
    .nav-link[aria-current="page"] {
      background: var(--soft);
      color: var(--ink);
    }

    .utility-menu { position: relative; }
    .utility-menu > summary {
      list-style: none;
      cursor: pointer;
    }
    .utility-menu > summary::-webkit-details-marker { display: none; }
    .utility-menu-content {
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      display: grid;
      gap: 6px;
      min-width: 150px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--paper);
      box-shadow: 0 12px 30px #29272014;
    }
    .utility-menu-content button {
      padding: 9px 10px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
      font: 0.85rem system-ui, sans-serif;
    }
    .utility-menu-content button:hover { background: var(--soft); }

    main {
      width: min(100% - 40px, 900px);
      margin: 0 auto;
      padding: 42px 0 72px;
    }

    .home-panel {
      min-height: 390px;
      display: grid;
      place-items: center;
      padding: 54px 18px 62px;
      text-align: center;
    }
    .home-content { width: min(100%, 680px); }
    .home-greeting {
      margin: 0 0 16px;
      font: 500 0.95rem system-ui, sans-serif;
    }
    .home-title {
      margin: 0 auto 18px;
      font-size: clamp(2.7rem, 7vw, 4.7rem);
      font-weight: 400;
      letter-spacing: -0.045em;
      line-height: 1.08;
    }
    .home-title span { display: block; font-style: italic; }
    .home-description {
      max-width: 390px;
      margin: 0 auto 24px;
      color: var(--muted);
      font: 0.98rem/1.65 system-ui, sans-serif;
    }
    .start-button {
      padding: 12px 19px;
      border: 1px solid var(--accent);
      border-radius: 9px;
      background: var(--accent);
      color: white;
      cursor: pointer;
      font: 600 0.9rem system-ui, sans-serif;
    }
    .start-button:hover { background: #59603f; }

    .eyebrow {
      color: var(--accent);
      font: 700 0.75rem/1.4 system-ui, sans-serif;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    h1 {
      margin: 8px 0;
      font-size: clamp(2.3rem, 7vw, 3.7rem);
      font-weight: 400;
      letter-spacing: -0.045em;
      line-height: 1.1;
    }

    .intro {
      max-width: 540px;
      margin: 0;
      color: var(--muted);
      font-size: 1.08rem;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 30px 0 26px;
    }

    .stat {
      padding: 16px 18px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--paper);
    }

    .stat-label {
      display: block;
      color: var(--muted);
      font: 0.78rem system-ui, sans-serif;
    }

    .stat strong {
      display: block;
      margin-top: 3px;
      font-size: 1.4rem;
      font-weight: 400;
    }
