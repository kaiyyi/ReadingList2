<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f6f1">
  <title>Ruang Baca — Cerita Hari Ini</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f8f6f1;
      --paper: #fffefa;
      --ink: #292720;
      --muted: #777367;
      --accent: #6d7352;
      --line: #e9e5da;
      --soft: #f0eee6;
      --danger: #8b4a40;
      --read-blue: #52769a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.6;
    }

    button, input, textarea {
      font: inherit;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.48;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 15;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 15px max(24px, calc((100vw - 1120px) / 2));
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--bg) 94%, transparent);
      backdrop-filter: blur(12px);
    }

    .brand {
      flex: 0 0 auto;
      color: var(--ink);
      font-size: 1.22rem;
      text-decoration: none;
    }

    .site-nav {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      flex-wrap: wrap;
    }

    .nav-link, .nav-icon-button {
      padding: 8px 10px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font: 600 0.82rem system-ui, sans-serif;
      text-decoration: none;
      white-space: nowrap;
    }

    .nav-link:hover, .nav-icon-button:hover,
    .nav-link[aria-current="page"] {
      background: var(--soft);
      color: var(--ink);
    }

    .utility-menu { position: relative; }
    .utility-menu > summary {
      list-style: none;
      cursor: pointer;
    }
    .utility-menu > summary::-webkit-details-marker { display: none; }
    .utility-menu-content {
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      display: grid;
      gap: 6px;
      min-width: 150px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--paper);
      box-shadow: 0 12px 30px #29272014;
    }
    .utility-menu-content button {
      padding: 9px 10px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
      font: 0.85rem system-ui, sans-serif;
    }
    .utility-menu-content button:hover { background: var(--soft); }

    main {
      width: min(100% - 40px, 900px);
      margin: 0 auto;
      padding: 42px 0 72px;
    }

    .home-panel {
      min-height: 390px;
      display: grid;
      place-items: center;
      padding: 54px 18px 62px;
      text-align: center;
    }
    .home-content { width: min(100%, 680px); }
    .home-greeting {
      margin: 0 0 16px;
      font: 500 0.95rem system-ui, sans-serif;
    }
    .home-title {
      margin: 0 auto 18px;
      font-size: clamp(2.7rem, 7vw, 4.7rem);
      font-weight: 400;
      letter-spacing: -0.045em;
      line-height: 1.08;
    }
    .home-title span { display: block; font-style: italic; }
    .home-description {
      max-width: 390px;
      margin: 0 auto 24px;
      color: var(--muted);
      font: 0.98rem/1.65 system-ui, sans-serif;
    }
    .start-button {
      padding: 12px 19px;
      border: 1px solid var(--accent);
      border-radius: 9px;
      background: var(--accent);
      color: white;
      cursor: pointer;
      font: 600 0.9rem system-ui, sans-serif;
    }
    .start-button:hover { background: #59603f; }

    .eyebrow {
      color: var(--accent);
      font: 700 0.75rem/1.4 system-ui, sans-serif;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    h1 {
      margin: 8px 0;
      font-size: clamp(2.3rem, 7vw, 3.7rem);
      font-weight: 400;
      letter-spacing: -0.045em;
      line-height: 1.1;
    }

    .intro {
      max-width: 540px;
      margin: 0;
      color: var(--muted);
      font-size: 1.08rem;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 30px 0 26px;
    }

    .stat {
      padding: 16px 18px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--paper);
    }

    .stat-label {
      display: block;
      color: var(--muted);
      font: 0.78rem system-ui, sans-serif;
    }

    .stat strong {
      display: block;
      margin-top: 3px;
      font-size: 1.4rem;
      font-weight: 400;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin: 26px 0 22px;
      overflow-x: auto;
      border-bottom: 1px solid var(--line);
    }

    .tab-button,
    .utility-button,
    .action-button,
    .quote-save-button,
    .swap-button,
    .daily-word-button,
    .filter-button {
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--paper);
      color: var(--ink);
      cursor: pointer;
      font: 600 0.86rem system-ui, sans-serif;
      padding: 9px 13px;
      white-space: nowrap;
    }

    .tab-button {
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
      color: var(--muted);
    }

    .tab-button[aria-selected="true"] {
      border-color: var(--accent);
      background: var(--accent);
      color: white;
    }

    .tab-button:not([aria-selected="true"]):hover,
    .utility-button:hover,
    .action-button:hover,
    .quote-save-button:hover,
    .swap-button:hover,
    .daily-word-button:hover,
    .filter-button:hover {
      background: var(--soft);
    }

    .view-panel[hidden],
    .quote-editor[hidden],
    .today-header[hidden] {
      display: none;
    }

    .section-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    h2 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 400;
    }

    h3 {
      font-weight: 400;
    }

    #today-date {
      color: var(--muted);
      font: 0.82rem system-ui, sans-serif;
      text-align: right;
    }

    .daily-word {
      margin: 0 0 24px;
      padding: 17px 19px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--paper);
    }

    .daily-word-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .daily-word h2 {
      font-size: 1.22rem;
    }

    .daily-word-button {
      padding: 6px 10px;
      color: var(--accent);
      font-size: 0.78rem;
    }

    .daily-word-quote {
      margin: 0 0 8px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 1.04rem;
    }

    .daily-word-story {
      color: var(--accent);
      font: 600 0.85rem system-ui, sans-serif;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .daily-word-empty {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .story-list,
    .saved-list,
    .all-story-list {
      display: grid;
      gap: 12px;
    }

    .story {
      padding: 19px 20px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--paper);
      transition: opacity 160ms ease, background 160ms ease;
    }

    .story.is-read {
      background: var(--soft);
      opacity: 0.72;
    }

    .story-top {
      display: flex;
      align-items: flex-start;
      gap: 13px;
    }

    .number {
      flex: 0 0 28px;
      padding-top: 4px;
      color: var(--accent);
      font: 0.82rem system-ui, sans-serif;
    }

    .story h3 {
      margin: 0;
      font-size: 1.12rem;
      line-height: 1.45;
    }

    .story-title-link {
      color: inherit;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .story-title-link:hover {
      color: var(--accent);
    }

    .story-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 15px 0 0 41px;
    }

    .story-action-buttons,
    .read-label,
    .quote-actions,
    .editor-actions,
    .backup-actions,
    .filter-buttons {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    
    .read-label {
      color: var(--muted);
      cursor: pointer;
      font: 0.85rem system-ui, sans-serif;
      user-select: none;
    }

    .read-label input {
      width: 18px;
      height: 18px;
      margin: 0;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .quote-save-button {
      border-color: var(--accent);
      color: var(--accent);
    }

    .swap-button {
      padding: 7px 10px;
    }

    .story-message {
      margin: 9px 0 0 41px;
      color: var(--muted);
      font: 0.8rem system-ui, sans-serif;
    }

    .empty-state {
      padding: 26px 20px;
      border: 1px dashed var(--line);
      border-radius: 14px;
      color: var(--muted);
      text-align: center;
    }

    .search-field {
      width: 100%;
      padding: 11px 13px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--paper);
      color: var(--ink);
      font: 0.92rem system-ui, sans-serif;
    }

    .search-field:focus,
    .form-field:focus,
    textarea:focus {
      outline: 2px solid #6d735255;
      outline-offset: 2px;
    }

    .search-wrap {
      margin: 18px 0;
    }

    .filter-buttons {
      margin: 0 0 18px;
    }

    .filter-button[aria-pressed="true"] {
      border-color: var(--accent);
      background: var(--accent);
      color: white;
    }

    .form-card,
    .backup-card {
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--paper);
    }

    .form-card h2,
    .backup-card h2 {
      margin-bottom: 8px;
    }

    .form-description,
    .backup-description {
      margin: 0 0 18px;
      color: var(--muted);
      font: 0.9rem/1.6 system-ui, sans-serif;
    }

    .form-field {
      display: block;
      width: 100%;
      margin: 7px 0 16px;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--paper);
      color: var(--ink);
      font: 0.92rem system-ui, sans-serif;
    }

    .form-label {
      font: 600 0.84rem system-ui, sans-serif;
    }

    .action-button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: white;
    }

    .action-button.danger {
      border-color: #d9bdb7;
      color: var(--danger);
    }

    .form-message,
    .backup-notice {
      margin: 13px 0 0;
      color: var(--accent);
      font: 0.86rem system-ui, sans-serif;
    }

    .form-message.error {
      color: var(--danger);
    }

    .backup-grid {
      display: grid;
      gap: 14px;
      margin-top: 18px;
    }

    .backup-actions {
      margin-top: 16px;
    }

    .file-input {
      display: none;
    }

    .footer {
      margin-top: 48px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font: 0.78rem/1.6 system-ui, sans-serif;
      text-align: center;
    }

    @media (max-width: 680px) {
      .site-header {
        align-items: flex-start;
        flex-direction: column;
        gap: 10px;
        padding: 12px 18px;
      }

      .site-nav {
        justify-content: flex-start;
        width: 100%;
      }

      .nav-link, .nav-icon-button {
        padding: 7px 8px;
        font-size: 0.76rem;
      }

      main {
        width: min(100% - 28px, 900px);
        padding-top: 25px;
      }

      .home-panel {
        min-height: 340px;
        padding: 40px 8px;
      }

      .stats {
        gap: 8px;
      }

      .stat {
        padding: 13px;
      }

      .story {
        padding: 15px;
      }

      .story-actions {
        align-items: flex-start;
        flex-direction: column;
        margin-left: 41px;
      }

      .section-heading {
        align-items: flex-start;
        flex-direction: column;
      }

      #today-date {
        text-align: left;
      }
    }
